    function init() {
        const body = document.getElementById('table-body');
        lowPartData.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.id}</td>
                <td><strong>${item.theme}</strong></td>
                <td class="lyric-cell" data-id="${item.id}">${item.lines.join(' / ')}</td>
            `;
            body.appendChild(tr);
        });
    }

    function formatSelection(className) {
        const selection = window.getSelection();
        if (!selection.rangeCount || selection.isCollapsed) return;

        const range = selection.getRangeAt(0);
        let container = range.commonAncestorContainer;
        if (container.nodeType === 3) container = container.parentNode;

        if (!container.closest('.lyric-cell')) return;

        const span = document.createElement('span');
        span.className = className;
        range.surroundContents(span);
        selection.removeAllRanges();
    }

    function exportJson() {
        const results = [];
        document.querySelectorAll('.lyric-cell').forEach(cell => {
            const liked = Array.from(cell.querySelectorAll('.good')).map(el => el.innerText.trim());
            const disliked = Array.from(cell.querySelectorAll('.bad')).map(el => el.innerText.trim());

            if (liked.length > 0 || disliked.length > 0) {
                results.push({
                    id: cell.getAttribute('data-id'),
                    full_line: cell.innerText.replace(/\s+/g, ' ').trim(),
                    preferences: { liked_phrases: liked, disliked_phrases: disliked }
                });
            }
        });

        const blob = new Blob([JSON.stringify({low_part_eval: results}, null, 2)], {type : 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'bounce_low_part_eval.json';
        a.click();
    }

    window.onload = init;
